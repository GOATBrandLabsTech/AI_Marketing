{% extends "base.html" %}
{% block title %}Sign in - Blinkit Control{% endblock %}
{% block guest %}
<div class="min-h-screen flex items-center justify-center p-4" style="background:radial-gradient(1200px 600px at 50% -10%, #eaf1fc 0%, #f4f4f2 60%);">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <div class="font-display w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-white text-xl mb-3 shadow-soft" style="background:linear-gradient(135deg,#3987e5,#1c5cab);">B</div>
      <div class="font-display text-lg font-bold text-ink">Blinkit Control</div>
      <div class="text-sm" style="color:var(--ink-muted)">AI marketing automation dashboard</div>
    </div>
    <div class="card p-8">
      {% if error %}
      <div class="mb-4 rounded-lg text-sm px-3 py-2.5 flex items-center gap-2" style="background:#fdecea;color:#9c2626;">
        <svg class="w-4 h-4 flex-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        {{ error }}
      </div>
      {% endif %}
      <form method="post">
        <label class="text-xs font-semibold uppercase tracking-wide block mb-1.5" style="color:var(--ink-muted)">Password</label>
        <input type="password" name="password" autofocus
               class="w-full rounded-lg border px-3 py-2.5 text-sm mb-5" style="border-color:var(--ring)">
        <button class="w-full text-white text-sm font-semibold rounded-lg py-2.5 transition shadow-soft" style="background:var(--brand);"
                onmouseover="this.style.background='var(--brand-dark)'" onmouseout="this.style.background='var(--brand)'">
          Sign in
        </button>
      </form>
    </div>
    <div class="text-center text-xs mt-5" style="color:var(--ink-muted)">Internal tool &middot; Voylla marketing automation</div>
  </div>
</div>
{% endblock %}
